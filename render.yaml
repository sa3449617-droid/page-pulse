# Render Blueprint — One-click deploy for Page Pulse
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: page-pulse
    runtime: python
    repo: https://github.com/sa3449617-droid/page-pulse
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    autoDeploy: true
